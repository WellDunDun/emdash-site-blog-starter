name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check scripts
        run: |
          node --check scripts/init-project.mjs
          node --check scripts/setup-cloudflare.mjs
          node --check scripts/smoke-test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
